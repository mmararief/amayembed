<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AmayStream — Video.js Player</title>
  <link rel="icon" href="/favicon.ico">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Video.js Core CSS & JS (v8) -->
  <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030712;
      color: #fff;
    }

    /* Video.js Modern Netflix Custom Skin */
    .video-js {
      width: 100% !important;
      height: 100% !important;
      background-color: #000;
    }

    /* Big Center Play Button */
    .video-js .vjs-big-play-button {
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      width: 72px !important;
      height: 72px !important;
      line-height: 70px !important;
      border-radius: 50% !important;
      border: 2px solid rgba(255, 255, 255, 0.2) !important;
      background: rgba(99, 102, 241, 0.85) !important;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.6) !important;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }
    .video-js:hover .vjs-big-play-button {
      background: rgba(79, 70, 229, 0.95) !important;
      transform: translate(-50%, -50%) scale(1.1) !important;
      box-shadow: 0 0 35px rgba(99, 102, 241, 0.9) !important;
    }

    /* Control Bar Glassmorphism */
    .video-js .vjs-control-bar {
      background: linear-gradient(180deg, transparent 0%, rgba(3, 7, 18, 0.85) 50%, rgba(3, 7, 18, 0.98) 100%) !important;
      height: 60px !important;
      padding: 0 14px 6px 14px !important;
      align-items: center !important;
    }

    /* Progress Play Bar & Slider */
    .video-js .vjs-progress-control {
      position: absolute !important;
      top: -12px !important;
      left: 14px !important;
      right: 14px !important;
      width: calc(100% - 28px) !important;
      height: 14px !important;
    }
    .video-js .vjs-progress-holder {
      height: 5px !important;
      background: rgba(255, 255, 255, 0.2) !important;
      border-radius: 9999px !important;
      transition: height 0.15s ease !important;
    }
    .video-js .vjs-progress-control:hover .vjs-progress-holder {
      height: 8px !important;
    }
    .video-js .vjs-play-progress {
      background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899) !important;
      border-radius: 9999px !important;
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.7) !important;
    }
    .video-js .vjs-play-progress:before {
      display: none !important;
    }
    .video-js .vjs-load-progress {
      background: rgba(255, 255, 255, 0.3) !important;
      border-radius: 9999px !important;
    }

    /* Buttons & Icons */
    .video-js .vjs-button > .vjs-icon-placeholder:before {
      font-size: 1.6rem !important;
      line-height: 48px !important;
      color: #e2e8f0 !important;
      transition: color 0.15s ease !important;
    }
    .video-js .vjs-button:hover > .vjs-icon-placeholder:before {
      color: #fff !important;
    }

    /* Time Display */
    .video-js .vjs-time-control {
      font-family: monospace !important;
      font-size: 12px !important;
      color: #cbd5e1 !important;
      line-height: 48px !important;
      padding: 0 4px !important;
    }

    /* Subtitle Cue */
    .video-js .vjs-text-track-cue > div {
      background-color: rgba(0, 0, 0, 0.8) !important;
      font-family: inherit !important;
      font-size: 1.2rem !important;
      border-radius: 6px !important;
      padding: 3px 8px !important;
    }

    /* Custom Glass Modal */
    .glass-modal {
      background: rgba(13, 17, 28, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-black text-white relative h-full w-full flex items-center justify-center select-none overflow-hidden">

  <!-- Container for Video.js -->
  <div class="relative w-full h-full bg-black overflow-hidden flex items-center justify-center">

    <video id="vjsPlayer" class="video-js vjs-default-skin vjs-big-play-centered" playsinline crossorigin="anonymous"></video>

    <!-- Top Overlay: Title & Active Server Badge -->
    <div id="topOverlay" class="absolute top-0 left-0 right-0 p-4 sm:p-5 flex items-center justify-between z-20 pointer-events-none bg-gradient-to-b from-black/80 via-black/30 to-transparent">
      <div class="flex items-center space-x-3 pointer-events-auto">
        <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-600/30">
          <i data-lucide="film" class="w-4 h-4 text-white"></i>
        </div>
        <div>
          <h1 id="mediaTitleText" class="text-xs sm:text-sm font-bold text-white tracking-wide truncate max-w-[200px] sm:max-w-md">Loading Stream...</h1>
          <p id="mediaSubText" class="text-[10px] text-slate-400 font-mono">TMDB: —</p>
        </div>
      </div>

      <!-- Server Selector Button -->
      <div class="flex items-center space-x-2 pointer-events-auto">
        <button onclick="toggleServerModal()" class="flex items-center space-x-2 px-3 py-1.5 rounded-full glass-modal hover:bg-white/10 text-xs transition border border-white/10">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="activeServerBadge" class="text-[11px] font-medium text-slate-200">Auto Server</span>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-400"></i>
        </button>
      </div>
    </div>

    <!-- Loading / Searching Screen -->
    <div id="loadingOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/80 backdrop-blur-sm z-30 transition-all duration-300">
      <div class="relative flex items-center justify-center mb-4">
        <div class="w-16 h-16 rounded-full border-4 border-indigo-500/20 border-t-indigo-500 animate-spin"></div>
        <div class="absolute w-8 h-8 rounded-full bg-indigo-600/30 blur-md animate-pulse"></div>
      </div>
      <h3 id="loadingTitle" class="text-sm font-semibold tracking-wider text-slate-100 uppercase">Searching Best Stream</h3>
      <p id="loadingSubtitle" class="text-xs text-slate-400 mt-1 max-w-xs text-center font-mono">Connecting Video.js to SSE pipeline...</p>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="absolute top-5 right-5 z-40 transition-all duration-300 opacity-0 transform -translate-y-3 pointer-events-none">
      <div class="px-4 py-2 rounded-xl glass-modal text-xs text-white shadow-2xl flex items-center gap-2.5 border border-white/10">
        <i id="toastIcon" data-lucide="sparkles" class="w-4 h-4 text-indigo-400 shrink-0"></i>
        <span id="toastMsg" class="font-medium">Connected</span>
      </div>
    </div>

    <!-- MODAL: SERVER SELECTOR -->
    <div id="serverModal" class="absolute bottom-20 right-4 sm:right-8 w-72 glass-modal rounded-2xl p-4 shadow-2xl z-40 hidden border border-white/10">
      <div class="flex items-center justify-between border-b border-white/10 pb-2 mb-2">
        <div class="flex items-center gap-2">
          <i data-lucide="server" class="w-4 h-4 text-indigo-400"></i>
          <span class="text-xs font-bold uppercase tracking-wider text-slate-200">Video.js Servers</span>
        </div>
        <button onclick="toggleServerModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div id="serverList" class="space-y-1.5 max-h-56 overflow-y-auto pr-1"></div>
    </div>

  </div>

  <script>
    // URL Params
    const urlParams = new URLSearchParams(window.location.search);
    const pathParts = window.location.pathname.replace(/^\/api\//, '/').split('/').filter(Boolean);

    let mediaType = urlParams.get('type') || 'movie';
    let tmdbId = urlParams.get('id');
    let season = urlParams.get('season') || urlParams.get('s') || 1;
    let episode = urlParams.get('episode') || urlParams.get('e') || 1;
    const autoplay = urlParams.get('autoplay') !== '0';

    if (pathParts[1] === 'movie' && pathParts[2]) {
      mediaType = 'movie';
      tmdbId = pathParts[2];
    } else if (pathParts[1] === 'tv' && pathParts[2]) {
      mediaType = 'tv';
      tmdbId = pathParts[2];
      season = pathParts[3] || 1;
      episode = pathParts[4] || 1;
    }

    let player = null;
    let eventSource = null;
    let sources = [];
    let subtitles = [];
    let currentIdx = -1;

    lucide.createIcons();

    // 1. Initialize Video.js Player Instance
    player = videojs('vjsPlayer', {
      controls: true,
      autoplay: autoplay,
      preload: 'auto',
      fluid: true,
      playbackRates: [0.5, 0.75, 1, 1.25, 1.5, 2],
      controlBar: {
        children: [
          'playToggle',
          'volumePanel',
          'currentTimeDisplay',
          'timeDivider',
          'durationDisplay',
          'progressControl',
          'playbackRateMenuButton',
          'subsCapsButton',
          'pictureInPictureToggle',
          'fullscreenToggle',
        ],
      },
    });

    // Fallback on Video.js playback error
    player.on('error', () => {
      console.warn('Video.js error encountered:', player.error());
      player.error(null); // clear overlay error
      triggerFallback();
    });

    // 2. Start SSE Discovery Pipeline
    if (!tmdbId) {
      showLoading('Missing Media ID', 'Usage: /embed/movie/:tmdbId or /embed?id=:tmdbId', false);
    } else {
      document.getElementById('mediaSubText').textContent = `TMDB #${tmdbId} ${mediaType === 'tv' ? `• S${season} E${episode}` : ''}`;
      startSseDiscovery();
    }

    function startSseDiscovery() {
      showLoading('Searching Best Server', 'Resolving candidates via Server-Sent Events...', true);

      const ssePath = mediaType === 'tv'
        ? `/tv?id=${encodeURIComponent(tmdbId)}&season=${season}&episode=${episode}`
        : `/movie?id=${encodeURIComponent(tmdbId)}`;

      eventSource = new EventSource(ssePath);

      eventSource.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);

          if (data.type === 'meta') {
            if (data.meta?.title) {
              document.getElementById('mediaTitleText').textContent = data.meta.title;
            }
            if (Array.isArray(data.subtitles)) {
              subtitles = data.subtitles;
              addSubtitlesToVideoJs(subtitles);
            }
          } 
          else if (data.type === 'source') {
            sources.push(data.source);
            renderServersList();

            // Auto-play the first working source immediately!
            if (currentIdx === -1) {
              playSourceWithVideoJs(0);
            }
          } 
          else if (data.type === 'done') {
            eventSource.close();
            if (sources.length === 0) {
              showLoading('No Playable Sources', 'All stream providers failed or returned no sources.', false);
            }
          }
        } catch (err) {
          console.error('SSE Error:', err);
        }
      };

      eventSource.onerror = () => {
        if (sources.length === 0) {
          showLoading('Stream Offline', 'Unable to reach backend Stream API.', false);
        }
        if (eventSource) eventSource.close();
      };
    }

    // 3. Play stream candidate using Video.js
    function playSourceWithVideoJs(index) {
      if (!sources[index]) return;
      currentIdx = index;
      const src = sources[index];

      document.getElementById('activeServerBadge').textContent = src.label || src.source;
      renderServersList();
      hideLoading();

      const streamUrl = src.url;
      const isHls = streamUrl.includes('.m3u8') || src.type === 'hls' || streamUrl.includes('api?url=');
      const mimeType = isHls ? 'application/x-mpegURL' : 'video/mp4';

      console.log('Video.js loading:', src.label, streamUrl);

      player.src({
        src: streamUrl,
        type: mimeType,
      });

      player.ready(() => {
        if (autoplay) {
          player.play().catch(e => console.log('Autoplay deferred:', e));
        }
      });

      showToast(`Server: ${src.label || src.source}`);
      postParent('source_change', { source: src.source, label: src.label });
    }

    function triggerFallback() {
      if (currentIdx + 1 < sources.length) {
        showToast(`Server failed. Trying backup server #${currentIdx + 2}...`);
        playSourceWithVideoJs(currentIdx + 1);
      } else {
        showLoading('Playback Failed', 'All candidate servers exhausted.', false);
      }
    }

    function addSubtitlesToVideoJs(tracks) {
      tracks.forEach((track, i) => {
        player.addRemoteTextTrack({
          kind: 'subtitles',
          label: track.label || `Track ${i + 1}`,
          srclang: (track.label || 'en').toLowerCase().slice(0, 2),
          src: track.file,
        }, false);
      });
    }

    function toggleServerModal() {
      const modal = document.getElementById('serverModal');
      modal.classList.toggle('hidden');
    }

    function renderServersList() {
      const list = document.getElementById('serverList');
      list.innerHTML = '';
      sources.forEach((src, i) => {
        const isCurrent = i === currentIdx;
        const btn = document.createElement('button');
        btn.className = `w-full text-left px-3 py-2 rounded-xl text-xs transition flex items-center justify-between ${
          isCurrent ? 'bg-indigo-600 text-white font-semibold shadow-md' : 'text-slate-300 hover:bg-white/10'
        }`;
        btn.innerHTML = `
          <div class="flex items-center space-x-2 truncate">
            <span class="w-1.5 h-1.5 rounded-full ${isCurrent ? 'bg-white' : 'bg-indigo-400'}"></span>
            <span class="truncate">${src.label || src.source}</span>
          </div>
          <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-black/40 border border-white/10">${src.quality || 'Auto'}</span>
        `;
        btn.onclick = () => {
          toggleServerModal();
          playSourceWithVideoJs(i);
        };
        list.appendChild(btn);
      });
    }

    function showLoading(title, sub, showSpinner) {
      const el = document.getElementById('loadingOverlay');
      document.getElementById('loadingTitle').textContent = title;
      document.getElementById('loadingSubtitle').textContent = sub;
      el.style.opacity = '1';
      el.style.pointerEvents = 'auto';
    }

    function hideLoading() {
      const el = document.getElementById('loadingOverlay');
      el.style.opacity = '0';
      el.style.pointerEvents = 'none';
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.remove('opacity-0', '-translate-y-3');
      setTimeout(() => toast.classList.add('opacity-0', '-translate-y-3'), 3000);
    }

    function postParent(event, data = {}) {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'stream_player', event, ...data }, '*');
        }
      } catch (e) {}
    }
  </script>
</body>
</html>
