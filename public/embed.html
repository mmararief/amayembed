<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AmayStream Player</title>
  <link rel="icon" href="/favicon.ico">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HLS.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      color: #fff;
    }
    video::-webkit-media-controls {
      display: none !important;
    }
    .idle .controls-bar {
      opacity: 0 !important;
      transform: translateY(12px) !important;
      pointer-events: none !important;
    }
    .idle {
      cursor: none !important;
    }
    /* Subtitle Styling */
    video::cue {
      background: rgba(0, 0, 0, 0.75) !important;
      color: #fff !important;
      font-size: 1.1rem !important;
      border-radius: 4px !important;
      padding: 2px 6px !important;
    }
  </style>
</head>
<body class="bg-black text-white relative h-full w-full flex items-center justify-center select-none overflow-hidden">

  <div id="playerRoot" class="relative w-full h-full bg-black overflow-hidden flex items-center justify-center">

    <!-- 1. Native HTML5 <video> Engine -->
    <video id="video" class="w-full h-full object-contain cursor-pointer" playsinline crossorigin="anonymous"></video>

    <!-- Loading Spinner -->
    <div id="loadingOverlay" class="absolute inset-0 flex items-center justify-center bg-black/60 backdrop-blur-[2px] z-30 pointer-events-none transition-opacity duration-300">
      <div class="w-12 h-12 border-3 border-white/20 border-t-white rounded-full animate-spin"></div>
    </div>

    <!-- 2. EXACT BOTTOM PILL CONTROLS (MATCHING SCREENSHOT) -->
    <div class="controls-bar absolute bottom-3 left-4 right-4 sm:left-6 sm:right-6 z-20 transition-all duration-300 pointer-events-auto">
      <div class="bg-black/60 hover:bg-black/75 backdrop-blur-md border border-white/10 rounded-xl px-3.5 py-2.5 flex items-center gap-3 text-white text-xs shadow-2xl transition-colors">
        
        <!-- Play / Pause -->
        <button id="btnPlay" onclick="togglePlay()" class="p-1 rounded-md hover:text-white text-slate-200 transition active:scale-95 focus:outline-none">
          <i id="playIcon" data-lucide="play" class="w-4 h-4 fill-current ml-0.5"></i>
        </button>

        <!-- Volume Speaker with Expandable Slider -->
        <div id="volumeWrapper" class="flex items-center gap-1.5 group/vol">
          <button onclick="toggleMute()" class="p-1 rounded-md hover:text-white text-slate-200 transition focus:outline-none">
            <i id="volIcon" data-lucide="volume-2" class="w-4 h-4"></i>
          </button>
          <div class="w-0 overflow-hidden group-hover/vol:w-16 transition-all duration-200 flex items-center">
            <input type="range" id="volSlider" min="0" max="1" step="0.05" value="1" 
              class="w-14 h-1 bg-white/30 rounded-full cursor-pointer accent-white" oninput="setVolume(this.value)">
          </div>
        </div>

        <!-- Current Time -->
        <span id="currentTimeText" class="font-mono text-[11px] text-slate-200 tracking-tight shrink-0">0:00</span>

        <!-- Scrubber Progress Bar -->
        <div id="progressTrack" class="relative flex-1 h-1 hover:h-1.5 bg-white/20 rounded-full cursor-pointer transition-all duration-150 group/scrub">
          <div id="progressBuffer" class="absolute top-0 left-0 h-full rounded-full bg-white/30" style="width: 0%;"></div>
          <div id="progressPlayed" class="absolute top-0 left-0 h-full rounded-full bg-white flex items-center justify-end" style="width: 0%;">
            <div class="w-2.5 h-2.5 bg-white rounded-full scale-0 group-hover/scrub:scale-100 transition-transform shadow-md"></div>
          </div>
        </div>

        <!-- Remaining Time -->
        <button id="btnTimeToggle" onclick="toggleTimeDisplay()" class="font-mono text-[11px] text-slate-300 hover:text-white tracking-tight shrink-0 transition">
          -0:00
        </button>

        <!-- Settings Cog (Gear) -->
        <div class="relative">
          <button onclick="toggleMenu('settingsMenu')" class="p-1 rounded-md text-slate-300 hover:text-white transition focus:outline-none">
            <i data-lucide="settings" class="w-4 h-4"></i>
          </button>

          <!-- Settings Popover -->
          <div id="settingsMenu" class="absolute bottom-11 right-0 w-52 bg-slate-950/95 border border-white/10 rounded-xl p-2 shadow-2xl text-xs space-y-1 backdrop-blur-xl hidden">
            <button onclick="openSubmenu('serversSubmenu')" class="w-full px-2.5 py-2 rounded-lg hover:bg-white/10 flex items-center justify-between text-slate-200 transition">
              <span class="flex items-center gap-2">
                <i data-lucide="server" class="w-3.5 h-3.5 text-slate-400"></i>
                <span>Server</span>
              </span>
              <div class="flex items-center gap-1 text-[11px] text-slate-400">
                <span id="activeServerName" class="truncate max-w-[80px]">Auto</span>
                <i data-lucide="chevron-right" class="w-3 h-3"></i>
              </div>
            </button>

            <button onclick="openSubmenu('speedSubmenu')" class="w-full px-2.5 py-2 rounded-lg hover:bg-white/10 flex items-center justify-between text-slate-200 transition">
              <span class="flex items-center gap-2">
                <i data-lucide="gauge" class="w-3.5 h-3.5 text-slate-400"></i>
                <span>Speed</span>
              </span>
              <div class="flex items-center gap-1 text-[11px] text-slate-400">
                <span id="speedValueText">1x</span>
                <i data-lucide="chevron-right" class="w-3 h-3"></i>
              </div>
            </button>
          </div>

          <!-- Servers Submenu -->
          <div id="serversSubmenu" class="absolute bottom-11 right-0 w-64 bg-slate-950/95 border border-white/10 rounded-xl p-2 shadow-2xl text-xs space-y-1 backdrop-blur-xl hidden max-h-56 overflow-y-auto">
            <div class="text-[10px] uppercase font-bold text-slate-400 px-2 py-1 border-b border-white/10">Select Server</div>
            <div id="serversListContainer" class="space-y-1 mt-1"></div>
          </div>

          <!-- Speed Submenu -->
          <div id="speedSubmenu" class="absolute bottom-11 right-0 w-40 bg-slate-950/95 border border-white/10 rounded-xl p-2 shadow-2xl text-xs space-y-1 backdrop-blur-xl hidden">
            <div class="text-[10px] uppercase font-bold text-slate-400 px-2 py-1 border-b border-white/10">Playback Speed</div>
            <div class="space-y-0.5 mt-1">
              <button onclick="setSpeed(0.5)" class="w-full px-2.5 py-1.5 rounded-lg flex items-center justify-between text-slate-300 hover:bg-white/10"><span>0.5x</span></button>
              <button onclick="setSpeed(0.75)" class="w-full px-2.5 py-1.5 rounded-lg flex items-center justify-between text-slate-300 hover:bg-white/10"><span>0.75x</span></button>
              <button onclick="setSpeed(1.0)" class="w-full px-2.5 py-1.5 rounded-lg flex items-center justify-between text-white font-semibold bg-white/15"><span>1.0x (Normal)</span></button>
              <button onclick="setSpeed(1.25)" class="w-full px-2.5 py-1.5 rounded-lg flex items-center justify-between text-slate-300 hover:bg-white/10"><span>1.25x</span></button>
              <button onclick="setSpeed(1.5)" class="w-full px-2.5 py-1.5 rounded-lg flex items-center justify-between text-slate-300 hover:bg-white/10"><span>1.5x</span></button>
              <button onclick="setSpeed(2.0)" class="w-full px-2.5 py-1.5 rounded-lg flex items-center justify-between text-slate-300 hover:bg-white/10"><span>2.0x</span></button>
            </div>
          </div>
        </div>

        <!-- Subtitles CC Button -->
        <div class="relative">
          <button onclick="toggleMenu('subtitlesMenu')" class="p-1 rounded-md text-slate-300 hover:text-white transition focus:outline-none">
            <i data-lucide="subtitles" class="w-4 h-4"></i>
          </button>

          <div id="subtitlesMenu" class="absolute bottom-11 right-0 w-56 bg-slate-950/95 border border-white/10 rounded-xl p-2 shadow-2xl text-xs space-y-1 backdrop-blur-xl hidden max-h-56 overflow-y-auto">
            <div class="text-[10px] uppercase font-bold text-slate-400 px-2 py-1 border-b border-white/10">Subtitles</div>
            <button onclick="selectSubtitle('off')" class="w-full px-2.5 py-1.5 rounded-lg flex items-center justify-between text-white font-semibold bg-white/15">
              <span>Off</span>
            </button>
            <div id="subtitlesListContainer" class="space-y-1 mt-1"></div>
          </div>
        </div>

        <!-- PiP -->
        <button onclick="togglePiP()" class="p-1 rounded-md hover:text-white text-slate-300 transition focus:outline-none">
          <i data-lucide="picture-in-picture-2" class="w-4 h-4"></i>
        </button>

        <!-- Fullscreen -->
        <button onclick="toggleFullscreen()" class="p-1 rounded-md hover:text-white text-slate-300 transition focus:outline-none">
          <i id="fullscreenIcon" data-lucide="maximize" class="w-4 h-4"></i>
        </button>

      </div>
    </div>

  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const pathParts = window.location.pathname.replace(/^\/api\//, '/').split('/').filter(Boolean);

    let mediaType = urlParams.get('type') || 'movie';
    let tmdbId = urlParams.get('id');
    let season = urlParams.get('season') || urlParams.get('s') || 1;
    let episode = urlParams.get('episode') || urlParams.get('e') || 1;
    const autoplay = urlParams.get('autoplay') !== '0';

    if (pathParts[1] === 'movie' && pathParts[2]) {
      mediaType = 'movie';
      tmdbId = pathParts[2];
    } else if (pathParts[1] === 'tv' && pathParts[2]) {
      mediaType = 'tv';
      tmdbId = pathParts[2];
      season = pathParts[3] || 1;
      episode = pathParts[4] || 1;
    }

    const video = document.getElementById('video');
    const playerRoot = document.getElementById('playerRoot');
    let hls = null;
    let eventSource = null;
    let sources = [];
    let subtitles = [];
    let currentIdx = -1;
    let activeSubIdx = 'off';
    let isPlaying = false;
    let hasStarted = false;
    let showRemaining = true;

    lucide.createIcons();

    // Auto-hide controls
    let idleTimer = null;
    function resetIdle() {
      playerRoot.classList.remove('idle');
      clearTimeout(idleTimer);
      if (isPlaying) {
        idleTimer = setTimeout(() => {
          playerRoot.classList.add('idle');
          closeAllMenus();
        }, 2600);
      }
    }

    document.addEventListener('mousemove', resetIdle);
    document.addEventListener('mousedown', resetIdle);
    document.addEventListener('touchstart', resetIdle);

    if (tmdbId) {
      initStreaming();
    }

    function initStreaming() {
      const ssePath = mediaType === 'tv'
        ? `/tv?id=${encodeURIComponent(tmdbId)}&season=${season}&episode=${episode}`
        : `/movie?id=${encodeURIComponent(tmdbId)}`;

      eventSource = new EventSource(ssePath);

      eventSource.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          if (data.type === 'meta') {
            if (Array.isArray(data.subtitles)) {
              subtitles = data.subtitles;
              renderSubtitlesList();
            }
          } else if (data.type === 'source') {
            sources.push(data.source);
            renderServersList();

            if (!hasStarted) {
              hasStarted = true;
              playSource(0);
            }
          } else if (data.type === 'done') {
            eventSource.close();
          }
        } catch (err) {
          console.error(err);
        }
      };

      eventSource.onerror = () => {
        if (eventSource) eventSource.close();
      };
    }

    // Engine: native <video> + Hls.js only if HLS
    function playSource(idx) {
      if (!sources[idx]) return;
      currentIdx = idx;
      const src = sources[idx];

      document.getElementById('activeServerName').textContent = src.label || src.source;
      renderServersList();

      const streamUrl = src.url;
      const isHls = streamUrl.includes('.m3u8') || src.type === 'hls' || streamUrl.includes('api?url=');

      if (hls) {
        hls.destroy();
        hls = null;
      }

      if (isHls && Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true, backBufferLength: 90 });
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          hideLoading();
          if (autoplay) video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) triggerFallback();
        });
      } else {
        video.src = streamUrl;
        video.load();
        video.onloadeddata = () => {
          hideLoading();
          if (autoplay) video.play().catch(() => {});
        };
        video.onerror = () => triggerFallback();
      }
    }

    function triggerFallback() {
      if (currentIdx + 1 < sources.length) {
        playSource(currentIdx + 1);
      }
    }

    // Play / Pause
    function togglePlay() {
      if (video.paused) video.play().catch(() => {});
      else video.pause();
    }

    video.addEventListener('play', () => {
      isPlaying = true;
      document.getElementById('playIcon').setAttribute('data-lucide', 'pause');
      lucide.createIcons();
      resetIdle();
    });

    video.addEventListener('pause', () => {
      isPlaying = false;
      document.getElementById('playIcon').setAttribute('data-lucide', 'play');
      lucide.createIcons();
      resetIdle();
    });

    video.addEventListener('click', togglePlay);

    // Time & Scrubber
    video.addEventListener('timeupdate', () => {
      if (!video.duration) return;
      const cur = video.currentTime;
      const dur = video.duration;
      document.getElementById('currentTimeText').textContent = formatTime(cur);

      if (showRemaining) {
        document.getElementById('btnTimeToggle').textContent = `-${formatTime(Math.max(0, dur - cur))}`;
      } else {
        document.getElementById('btnTimeToggle').textContent = formatTime(dur);
      }

      document.getElementById('progressPlayed').style.width = `${(cur / dur) * 100}%`;

      if (video.buffered.length > 0) {
        const buf = video.buffered.end(video.buffered.length - 1);
        document.getElementById('progressBuffer').style.width = `${(buf / dur) * 100}%`;
      }
    });

    function toggleTimeDisplay() {
      showRemaining = !showRemaining;
    }

    document.getElementById('progressTrack').addEventListener('click', (e) => {
      if (!video.duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      video.currentTime = pos * video.duration;
    });

    // Volume
    function setVolume(val) {
      video.volume = parseFloat(val);
      video.muted = (video.volume === 0);
      updateVolIcon();
    }

    function toggleMute() {
      video.muted = !video.muted;
      updateVolIcon();
    }

    function updateVolIcon() {
      const icon = document.getElementById('volIcon');
      if (video.muted || video.volume === 0) icon.setAttribute('data-lucide', 'volume-x');
      else if (video.volume < 0.5) icon.setAttribute('data-lucide', 'volume-1');
      else icon.setAttribute('data-lucide', 'volume-2');
      lucide.createIcons();
    }

    // Fullscreen & PiP
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        playerRoot.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const icon = document.getElementById('fullscreenIcon');
      icon.setAttribute('data-lucide', document.fullscreenElement ? 'minimize' : 'maximize');
      lucide.createIcons();
    });

    async function togglePiP() {
      try {
        if (document.pictureInPictureElement) await document.exitPictureInPicture();
        else if (document.pictureInPictureEnabled) await video.requestPictureInPicture();
      } catch (e) {}
    }

    // Menus
    function toggleMenu(id) {
      const menu = document.getElementById(id);
      const isHidden = menu.classList.contains('hidden');
      closeAllMenus();
      if (isHidden) menu.classList.remove('hidden');
    }

    function openSubmenu(id) {
      document.getElementById('settingsMenu').classList.add('hidden');
      document.getElementById(id).classList.remove('hidden');
    }

    function closeAllMenus() {
      ['settingsMenu', 'serversSubmenu', 'speedSubmenu', 'subtitlesMenu'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.controls-bar')) {
        closeAllMenus();
      }
    });

    function setSpeed(val) {
      video.playbackRate = val;
      document.getElementById('speedValueText').textContent = `${val}x`;
      closeAllMenus();
    }

    function renderServersList() {
      const container = document.getElementById('serversListContainer');
      container.innerHTML = '';
      sources.forEach((src, i) => {
        const btn = document.createElement('button');
        btn.className = `w-full px-2.5 py-1.5 rounded-lg flex items-center justify-between transition ${
          i === currentIdx ? 'bg-white/15 text-white font-medium' : 'text-slate-300 hover:bg-white/10'
        }`;
        btn.innerHTML = `
          <span class="truncate">${src.label || src.source}</span>
          <span class="text-[10px] text-slate-400 font-mono">${src.quality || 'Auto'}</span>
        `;
        btn.onclick = () => {
          playSource(i);
          closeAllMenus();
        };
        container.appendChild(btn);
      });
    }

    function renderSubtitlesList() {
      const container = document.getElementById('subtitlesListContainer');
      container.innerHTML = '';
      subtitles.forEach((track, i) => {
        const btn = document.createElement('button');
        btn.className = 'w-full px-2.5 py-1.5 rounded-lg flex items-center justify-between truncate text-slate-300 hover:bg-white/10 transition';
        btn.innerHTML = `<span class="truncate">${track.label || 'Track ' + (i + 1)}</span>`;
        btn.onclick = () => {
          selectSubtitle(i);
          closeAllMenus();
        };
        container.appendChild(btn);

        const trackEl = document.createElement('track');
        trackEl.kind = 'subtitles';
        trackEl.label = track.label;
        trackEl.src = track.file;
        trackEl.srclang = (track.label || 'en').toLowerCase().slice(0, 2);
        video.appendChild(trackEl);
      });
    }

    function selectSubtitle(val) {
      activeSubIdx = val;
      const tracks = video.textTracks;
      for (let i = 0; i < tracks.length; i++) {
        tracks[i].mode = (val !== 'off' && val === i) ? 'showing' : 'disabled';
      }
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').style.opacity = '0';
    }

    function formatTime(sec) {
      sec = Math.floor(sec) || 0;
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      return `${m}:${s.toString().padStart(2, '0')}`;
    }
  </script>
</body>
</html>
